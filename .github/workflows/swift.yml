name: iOS

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: TEMP check committed pbxproj matches CI xcodegen
        continue-on-error: true
        run: git diff --stat --exit-code -- FlockSurveillance.xcodeproj && echo "PBXPROJ_MATCHES_CI_XCODEGEN" || { git diff -- FlockSurveillance.xcodeproj; echo "PBXPROJ_DRIFT"; exit 1; }

      - name: Build and test
        run: |
          # Pick whatever iPhone simulator the runner image ships, so the job
          # survives Xcode/simulator runtime bumps.
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [A-Za-z0-9 ]+' | head -1 | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          # Fail the step when xcodebuild fails (compile error or failing test).
          # Without pipefail the pipeline's exit status is xcbeautify's, which is
          # almost always 0, so broken builds used to show green. Set it here,
          # after the DEVICE lookup, so `head -1` closing early can't trip it.
          set -o pipefail
          xcodebuild test \
            -scheme FlockSurveillance \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
